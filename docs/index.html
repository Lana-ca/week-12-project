<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Grimoire - A Living Chronicle</title>
    <meta name="description" content="An interactive family history grimoire preserving memories, recipes, and stories across generations">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles-addon.css">
</head>
<body>
    <div class="page-container">
        <!-- Title overlay -->
        <div class="title-overlay">
            <h1>Family Grimoire</h1>
        </div>

        <!-- Grimoire Book Container -->
        <div class="book-wrapper">
            <!-- Book Binding -->
            <div class="book-binding">
                <div class="binding-gradient"></div>
                <div class="stitch stitch-1"></div>
                <div class="stitch stitch-2"></div>
                <div class="stitch stitch-3"></div>
            </div>

            <!-- Book Pages (Content loaded dynamically) -->
            <div class="book-pages">
                <!-- Left Page -->
                <div class="page page-left">
                    <div class="page-number"></div>
                    <div class="page-content">
                        <!-- Content loaded by JavaScript -->
                    </div>
                    <div class="page-curl"></div>
                </div>

                <!-- Right Page -->
                <div class="page page-right">
                    <div class="page-number page-number-right"></div>
                    <div class="page-content">
                        <!-- Content loaded by JavaScript -->
                    </div>
                    <div class="rain-container" id="rainContainer"></div>
                    <div class="page-curl"></div>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <button class="nav-button nav-prev" aria-label="Previous page" title="Previous page (or press ← key)">←</button>
            <button class="nav-button nav-next" aria-label="Next page" title="Next page (or press → key)">→</button>

            <!-- Bookmark -->
            <div class="bookmark"></div>
        </div>

        <!-- Instructions (fade out after 5 seconds) -->
        <div class="instructions" id="instructions">
            <p>Use arrow buttons or keyboard (← →) to navigate</p>
            <p>Click table of contents items to jump to pages</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
